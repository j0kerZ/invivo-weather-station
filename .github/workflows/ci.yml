# Every test on every push and pull request. Actions are pinned to commit SHAs, and the token
# can only read the repository.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware (C, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake -S firmware -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  cloud:
    name: Cloud (decoder, Lambda, CDK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the Lambda runtime
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p amplify/tsconfig.json
      - run: npm test
